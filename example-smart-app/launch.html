        <title>Example-SMART-App</title>

    <body>
        <!-- Required JS files to enable this page to embed within an MPage -->

        <!-- FHIR Client JS Library - v2 with PKCE support -->
        <script src="https://cdn.jsdelivr.net/npm/fhirclient@2.5.2/build/fhir-client.min.js"></script>
        <script>
            FHIR.oauth2.authorize({
                clientId: "43964a28-4dbe-4102-8cc9-523158433e3b",
                scope: "patient/Patient.read patient/Observation.read launch openid profile fhirUser",
                redirectUri:
                    "https://jackc6243.github.io/smart-on-fhir-tutorial/example-smart-app/",
                iss: new URLSearchParams(window.location.search).get("iss"),
                launch: new URLSearchParams(window.location.search).get(
                    "launch",
                ),
            });
        </script>
        <div class="spinner">
            <div class="bounce1"></div>
            <div class="bounce2"></div>
            <div class="bounce3"></div>
        </div>
    </body>
